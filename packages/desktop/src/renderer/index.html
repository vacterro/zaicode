<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZAICODE</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      #loading {
        background: #1a1810;
      }

      .zaicode-startup-splash {
        display: block;
        width: 560px;
        height: 300px;
        max-width: 100vw;
        max-height: 100vh;
        object-fit: contain;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #000000 0%, #151718 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。*/
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .startup-logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div
      id="loading"
      class="[app-region:drag]"
      role="status"
      aria-busy="true"
      aria-label="Loading..."
    >
      <!-- ZAICODE (SRC-048): the SAIPEN splash picture, still; no pop animation. -->
      <img class="zaicode-startup-splash" src="./zaicode-splash.png" width="560" height="300" alt="" />
    </div>
    <script>
      // ZAICODE (SRC-049): the operator's own splash picture, mirrored by the
      // settings page, replaces the bundled one before anything paints.
      // SRC-060: so do the splash options (fit, hold until ready, longest wait).
      window.__ZAICODE_SPLASH_BOOT__ = { hold: true, maxWaitMs: 60000, fit: "contain" };
      try {
        var customSplash = localStorage.getItem("zaicode-splash-image");
        var splashImage = document.querySelector("#loading .zaicode-startup-splash");
        if (customSplash) {
          splashImage.src = customSplash;
        }
        var boot = JSON.parse(localStorage.getItem("zaicode-splash-boot") || "null");
        if (boot && typeof boot === "object") {
          if (typeof boot.hold === "boolean") window.__ZAICODE_SPLASH_BOOT__.hold = boot.hold;
          if (typeof boot.maxWaitMs === "number" && boot.maxWaitMs >= 1000 && boot.maxWaitMs <= 120000) {
            window.__ZAICODE_SPLASH_BOOT__.maxWaitMs = boot.maxWaitMs;
          }
          if (boot.fit === "cover" || boot.fit === "stretch") window.__ZAICODE_SPLASH_BOOT__.fit = boot.fit;
        }
        var fit = window.__ZAICODE_SPLASH_BOOT__.fit;
        splashImage.style.objectFit = fit === "stretch" ? "fill" : fit;
      } catch (error) {
        /* bundled picture and defaults stay */
      }
    </script>
    <script type="module">
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      // ZAICODE (SRC-060): by default the loading picture stays until the interface
      // is usable ("zcode-app-interactive": projects restored and input mounted,
      // sign-in shown, or a start-up error needs the operator), not merely until
      // React's first frame, which is the grey start-up screen. The main process
      // keeps the window hidden until this page says ready.
      const splashBoot = window.__ZAICODE_SPLASH_BOOT__ ?? { hold: true, maxWaitMs: 60000 };
      if (isUpdateStatusWindow) {
        // 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener(
          splashBoot.hold ? "zcode-app-interactive" : "zcode-react-startup-ready",
          markReactReady,
          { once: true },
        );
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, splashBoot.hold ? splashBoot.maxWaitMs : 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>

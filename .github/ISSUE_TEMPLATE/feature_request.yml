name: Feature request
description: Something ZAICODE should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        What are you trying to do? Describe the goal, not the button — there is
        usually more than one way to reach it.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation, not the requested feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead